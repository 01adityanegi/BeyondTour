{% extends '_base.html' %}
{% block title %}Reset Password — Beyond Tour{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6">
  <div class="w-full max-w-md bg-surface rounded-card shadow-card border border-stone/50 p-8 sm:p-10 text-charcoal">
    <div class="w-12 h-12 rounded-2xl bg-pine flex items-center justify-center mx-auto mb-4 text-terracotta shadow-md">
      <i data-lucide="key" class="w-6 h-6"></i>
    </div>
    <h1 class="font-serif text-2xl font-bold text-center mb-2">Reset Password</h1>
    <p class="text-xs text-charcoal/60 text-center mb-6 leading-relaxed">
      Enter the email associated with your account, and we will dispatch a secure reset link.
    </p>

    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs font-semibold text-charcoal/80 mb-1.5">Email Address</label>
        <input type="email" name="email" required placeholder="name@example.com"
               class="w-full bg-ivory border border-stone rounded-xl px-4 py-2.5 text-sm text-charcoal focus:outline-none focus:border-terracotta">
      </div>
      <button type="submit"
              class="w-full py-3 rounded-full bg-terracotta hover:bg-terracotta-hover text-white text-xs font-semibold shadow-sm transition-colors">
        Send Reset Link
      </button>
    </form>

    <div class="pt-6 mt-6 border-t border-stone/40 text-center">
      <a href="{{ url_for('auth.login') }}" class="text-xs font-semibold text-terracotta hover:underline">
        Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
