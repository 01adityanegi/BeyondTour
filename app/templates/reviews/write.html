{% extends '_base.html' %}
{% block title %}Write a Review — Beyond Tour{% endblock %}
{% block content %}
<div class="pt-4 sm:pt-6 pb-16 min-h-screen bg-ivory">
  <div class="max-w-xl mx-auto px-4 sm:px-6 pt-2 pb-12">
    <div class="bg-white rounded-card shadow-card p-8 border border-stone/40">
      <div class="mb-6 text-center">
        <p class="text-terracotta font-semibold text-xs uppercase tracking-widest mb-1">Your Feedback</p>
        <h1 class="font-serif text-3xl font-bold text-charcoal">Write a Review</h1>
      </div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="target_type" value="{{ target_type }}">
        <input type="hidden" name="target_id" value="{{ target_id }}">
        <div class="mb-6" x-data="{ rating: 5 }">
          <label class="block text-sm font-semibold text-charcoal mb-3">Your Rating</label>
          <div class="flex gap-2">
            {% for i in range(1, 6) %}
            <button type="button" @click="rating = {{ i }}" class="p-1 transition-transform hover:scale-110 focus:outline-none" aria-label="Rate {{ i }} stars">
              <svg class="w-8 h-8 transition-colors"
                   :class="rating >= {{ i }} ? 'text-terracotta fill-terracotta' : 'text-stone stroke-current fill-none'"
                   viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>
            {% endfor %}
            <input type="hidden" name="rating" :value="rating">
          </div>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-semibold text-charcoal mb-2">Your Review</label>
          <textarea name="comment" rows="5" required placeholder="Share your authentic experience with fellow travelers..." class="w-full bg-ivory border border-stone/40 rounded-xl p-4 text-sm text-charcoal focus:outline-none focus:border-terracotta resize-none"></textarea>
        </div>
        <button type="submit" class="w-full py-4 bg-terracotta text-white font-semibold rounded-2xl hover:bg-terracotta-dark transition-all shadow-sm flex items-center justify-center gap-2">
          <i data-lucide="check" class="w-5 h-5"></i> Submit Review
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
